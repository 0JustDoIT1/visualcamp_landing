name: CI

on:
  push:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job 이름 "ci"가 Vercel Deployment Checks에서 선택할 체크 이름이 된다.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # 빠르게 실패하는 것부터
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
